name: Build MEMORA Sentences

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - agent/standalone-refresh
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted dinosaur mascot UI patch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/add-dinosaur-mascots'
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          python .github/agent-apply-dinosaur-mascots.py
          rm .github/agent-apply-dinosaur-mascots.py
          cat > .github/workflows/build.yml <<'EOF'
          name: Build MEMORA Sentences

          on:
            push:
              branches:
                - main
                - agent/standalone-refresh
            pull_request:
              branches:
                - main

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: package.json

                - name: Install dependencies
                  run: npm install

                - name: Build
                  run: npm run build
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add dinosaur mascots to learning screens"
          git push origin HEAD:"$GITHUB_HEAD_REF"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
