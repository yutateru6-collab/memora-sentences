name: Build MEMORA Sentences

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - agent/standalone-refresh
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply focused first-screen CTA change
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-handheld-material-cta'
        shell: bash
        run: |
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          python - <<'PY'
          from pathlib import Path
          path = Path('components/UploadScreen.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''                <button
                  type="button"
                  onClick={() => setIsAddModalOpen(true)}
                  className={`min-h-12 flex-1 px-6 py-3 ${T.buttonStrong} rounded-xl font-bold shadow-sm transition-all hover:-translate-y-0.5 active:scale-[0.98]`}
                >
                  <span className="mr-2" aria-hidden="true">＋</span>手持ちの教材を追加
                </button>
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one handheld CTA, found {count}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          rm -f .github/workflows/agent-remove-handheld-material.yml
          cat > .github/workflows/build.yml <<'EOF'
          name: Build MEMORA Sentences

          on:
            push:
              branches:
                - main
                - agent/standalone-refresh
            pull_request:
              branches:
                - main

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: package.json

                - name: Install dependencies
                  run: npm install

                - name: Build
                  run: npm run build
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove handheld material CTA from first screen"
          git push origin HEAD:"$GITHUB_HEAD_REF"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
