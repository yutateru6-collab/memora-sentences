name: Build MEMORA Sentences

on:
  push:
    branches:
      - main
      - agent/standalone-refresh
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  patch_targeted_fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-player-pdf-quiz-final' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-player-pdf-quiz-final
          fetch-depth: 0

      - name: Apply targeted fixes from latest main
        run: |
          git checkout origin/main -- components/ReaderScreen.tsx components/PdfExportModal.tsx components/QuizCreationModal.tsx
          python .github/agent-fix-player-pdf-quiz.py

      - name: Build and diff check
        run: |
          npm install
          npm run build
          git diff --check

      - name: Verify PDF and quiz compatibility
        shell: bash
        run: |
          cat > .agent-parser-tests.ts <<'TS'
          import { parsePdfWordCards, formatPdfPronunciation } from './components/PdfExportModal';
          import { parseQuizContent } from './components/QuizCreationModal';

          const assert = (condition: unknown, message: string) => {
            if (!condition) throw new Error(message);
          };

          const jsonCards = parsePdfWordCards(`\`\`\`json
          [{"front":"ramen","back":"ラーメン、中華麺","pronunciation":"[ラ]ーメン","memo":"【語源・雑学】test\\n【覚え方】test\\n【例文】test"}]
          \`\`\``, 'words.txt', 'text/plain');
          assert(jsonCards.length === 1 && jsonCards[0].front === 'ramen', 'JSON stored as text/plain must parse');
          assert(jsonCards[0].pronunciation === '[ラ]ーメン', 'JSON pronunciation must be preserved');

          const richSlash = parsePdfWordCards('🍜 ramen [ラ]ーメン / ラーメン、中華麺 / ラテン語由来の雑学。【覚え方】ラーメンで覚える / I ate ramen.', 'words.txt', 'text/plain');
          assert(richSlash[0].front === 'ramen', 'rich slash front must be separated');
          assert(richSlash[0].back === 'ラーメン、中華麺', 'rich slash meaning must remain back');
          assert(richSlash[0].pronunciation === '[ラ]ーメン', 'rich slash pronunciation must be separated');
          assert((richSlash[0].memo || '').includes('【例文】'), 'rich slash example must be in memo');

          const legacySlash = parsePdfWordCards('ramen / ラーメン / ラーメン / memo', 'words.txt', 'text/plain');
          assert(legacySlash[0].pronunciation === 'ラーメン' && legacySlash[0].memo === 'memo', 'legacy four-column slash must remain compatible');
          assert(formatPdfPronunciation('[ラ]ーメン') === '[ラ]ーメン', 'accent brackets must not double');
          assert(formatPdfPronunciation('ラーメン') === '[ラーメン]', 'legacy pronunciation must keep existing display style');

          const quiz = parseQuizContent(`\`\`\`json
          [{"question":"What is ramen?","choices":["A","B","C","D"],"correctAnswerIndex":1,"explanationCorrect":"ok","explanationIncorrect":"no"}]
          \`\`\``);
          assert(quiz.length === 1 && quiz[0].correctAnswerIndex === 1, 'fenced quiz JSON must parse');

          let invalidChoicesRejected = false;
          try {
            parseQuizContent('[{"question":"Q","choices":["A","B"],"correctAnswerIndex":0}]');
          } catch {
            invalidChoicesRejected = true;
          }
          assert(invalidChoicesRejected, 'invalid choice count must be rejected');

          let invalidIndexRejected = false;
          try {
            parseQuizContent('[{"question":"Q","choices":["A","B","C","D"],"correctAnswerIndex":4}]');
          } catch {
            invalidIndexRejected = true;
          }
          assert(invalidIndexRejected, 'invalid correctAnswerIndex must be rejected');

          console.log('Parser compatibility checks passed');
          TS
          ./node_modules/.bin/esbuild .agent-parser-tests.ts --bundle --platform=node --format=esm --outfile=/tmp/agent-parser-tests.mjs
          node /tmp/agent-parser-tests.mjs
          rm .agent-parser-tests.ts

          grep -q 'window.print()' components/PdfExportModal.tsx
          grep -q 'size: B5 landscape' components/PdfExportModal.tsx
          grep -q 'await onUpdateMaterial(materialId, { quizFile: file })' components/ReaderScreen.tsx
          grep -q 'onStartQuiz(materialId)' components/ReaderScreen.tsx

      - name: Commit only targeted files
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/build.yml
          git rm .github/agent-fix-player-pdf-quiz.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/ReaderScreen.tsx components/PdfExportModal.tsx components/QuizCreationModal.tsx .github/workflows/build.yml
          git commit -m "fix: pin mobile player and harden PDF quiz inputs"
          git push origin HEAD:agent/fix-player-pdf-quiz-final
