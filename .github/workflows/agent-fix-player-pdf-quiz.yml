name: Verify targeted player PDF and quiz fixes

on:
  push:
    branches:
      - agent/fix-player-pdf-quiz-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-player-pdf-quiz-final
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # ReaderScreen: on mobile, anchor the expanded player to the actual viewport bottom.
          path = Path('components/ReaderScreen.tsx')
          text = path.read_text()
          old = '''                <div className={`flex-shrink-0 flex flex-col gap-1 px-3 py-2 ${T.panelBg} border-t ${T.border} transition-all duration-100 z-20 relative pb-safe shadow-[0_-5px_20px_rgba(0,0,0,0.3)]`}>
'''
          new = '''                <div
                    className={`fixed inset-x-0 bottom-0 sm:relative sm:inset-x-auto sm:bottom-auto flex-shrink-0 flex flex-col gap-1 px-3 py-2 ${T.panelBg} border-t ${T.border} transition-all duration-100 z-30 sm:z-20 pb-safe shadow-[0_-5px_20px_rgba(0,0,0,0.3)]`}
                    style={{ paddingBottom: 'max(0.5rem, env(safe-area-inset-bottom))' }}
                >
'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)
          path.write_text(text)

          # PdfExportModal: make word parsing content-aware and keep legacy slash compatibility.
          path = Path('components/PdfExportModal.tsx')
          text = path.read_text()
          component_anchor = '''const PdfExportModal: React.FC<PdfExportModalProps> = ({ T, onClose, materialId, title, transcript, hasWordFile, hasQuizFile }) => {
'''
          helpers = r'''const stripWordCodeFences = (text: string) => text
  .trim()
  .replace(/^```(?:json|text)?\s*/i, '')
  .replace(/\s*```$/, '')
  .trim();

const mapCardJsonArray = (json: any[]): Card[] => json.map((item: any, index: number) => ({
  id: index,
  front: item.front || item.word || '',
  back: item.back || item.meaning || '',
  pronunciation: item.pronunciation,
  memo: item.memo,
}));

export const formatPdfPronunciation = (value?: string) => {
  if (!value) return '';
  const normalized = value.replace(/［/g, '[').replace(/］/g, ']');
  return normalized.includes('[') || normalized.includes(']') ? normalized : `[${normalized}]`;
};

export const parsePdfWordCards = (rawText: string, fileName = '', fileType = ''): Card[] => {
  const text = stripWordCodeFences(rawText);
  const isDeclaredJson = fileName.toLowerCase().endsWith('.json') || fileType === 'application/json';

  if (text.startsWith('[')) {
    try {
      const json = JSON.parse(text);
      if (Array.isArray(json)) return mapCardJsonArray(json);
      if (isDeclaredJson) return [];
    } catch (e) {
      if (isDeclaredJson) return [];
    }
  } else if (isDeclaredJson) {
    return [];
  }

  return text.split('\n').filter(line => line.trim()).map((line, index) => {
    const spacedParts = line.split(/\s+\/\s+/).map(part => part.trim());
    const parts = spacedParts.length >= 2 ? spacedParts : line.split('/').map(part => part.trim());
    const firstPart = parts[0] || '';
    const richPromptFormat = parts.length >= 4 && /語源|雑学|【覚え方】/.test(parts[2] || '');

    if (richPromptFormat) {
      const withoutLeadingEmoji = firstPart.replace(/^[^A-Za-z0-9]+/, '').trim();
      const pronunciationMatch = withoutLeadingEmoji.match(/^(.+?)\s+([ァ-ヶー]*[［\[][ァ-ヶー]+[］\]][ァ-ヶー]*|[ァ-ヶー]+)\s*$/);
      if (pronunciationMatch) {
        const etymology = parts[2] || '';
        const example = parts.slice(3).join(' / ');
        return {
          id: index,
          front: pronunciationMatch[1].trim(),
          back: parts[1] || '',
          pronunciation: pronunciationMatch[2].replace(/［/g, '[').replace(/］/g, ']'),
          memo: `${etymology.startsWith('【語源・雑学】') ? '' : '【語源・雑学】\n'}${etymology}${example ? `\n\n【例文】\n${example}` : ''}`,
        };
      }
    }

    return {
      id: index,
      front: parts[0] || '',
      back: parts[1] || '',
      pronunciation: parts[2],
      memo: parts[3],
    };
  });
};

'''
          assert text.count(component_anchor) == 1
          text = text.replace(component_anchor, helpers + component_anchor, 1)

          load_start = text.index('                const text = await material.wordFile.text();\n                let parsedCards: Card[] = [];')
          load_end_marker = '                setWords(parsedCards);\n'
          load_end = text.index(load_end_marker, load_start) + len(load_end_marker)
          replacement = '''                const text = await material.wordFile.text();
                const parsedCards = parsePdfWordCards(text, material.wordFile.name, material.wordFile.type);
                setWords(parsedCards);
'''
          text = text[:load_start] + replacement + text[load_end:]

          old_copy = '''              if (w.pronunciation) text += ` [${w.pronunciation}]`;
'''
          new_copy = '''              if (w.pronunciation) text += ` ${formatPdfPronunciation(w.pronunciation)}`;
'''
          assert text.count(old_copy) == 1, text.count(old_copy)
          text = text.replace(old_copy, new_copy, 1)

          old_preview = '''                            {w.pronunciation && <span className="text-[10px] text-stone-500 font-mono">[{w.pronunciation}]</span>}
'''
          new_preview = '''                            {w.pronunciation && <span className="text-[10px] text-stone-500 font-mono">{formatPdfPronunciation(w.pronunciation)}</span>}
'''
          assert text.count(old_preview) == 1, text.count(old_preview)
          text = text.replace(old_preview, new_preview, 1)
          path.write_text(text)

          # QuizCreationModal: accept AI Studio fenced JSON and validate the shape before saving.
          path = Path('components/QuizCreationModal.tsx')
          text = path.read_text()
          quiz_component_anchor = '''const QuizCreationModal: React.FC<QuizCreationModalProps> = ({ T, transcript, personaProfile, onClose, onSave, isAdding = false }) => {
'''
          quiz_helpers = r'''const stripQuizCodeFences = (content: string) => content
    .trim()
    .replace(/^```(?:json|text)?\s*/i, '')
    .replace(/\s*```$/, '')
    .trim();

export const parseQuizContent = (content: string): QuizQuestion[] => {
    const cleaned = stripQuizCodeFences(content);
    let parsed: unknown;

    try {
        parsed = JSON.parse(cleaned);
    } catch (e) {
        throw new Error('無効なJSON形式です。AI StudioのJSONコードブロック全体をそのまま貼り付けても保存できます。');
    }

    if (!Array.isArray(parsed) || parsed.length === 0) {
        throw new Error('JSONが配列形式ではありません、または問題が空です。');
    }

    parsed.forEach((item, index) => {
        const question = item as Partial<QuizQuestion>;
        if (typeof question.question !== 'string' || !question.question.trim()) {
            throw new Error(`問題${index + 1}の question が正しくありません。`);
        }
        if (!Array.isArray(question.choices) || question.choices.length !== 4 || question.choices.some(choice => typeof choice !== 'string' || !choice.trim())) {
            throw new Error(`問題${index + 1}の choices は4つの文字列にしてください。`);
        }
        if (!Number.isInteger(question.correctAnswerIndex) || question.correctAnswerIndex! < 0 || question.correctAnswerIndex! > 3) {
            throw new Error(`問題${index + 1}の correctAnswerIndex は0〜3の整数にしてください。`);
        }
    });

    return parsed as QuizQuestion[];
};

'''
          assert text.count(quiz_component_anchor) == 1
          text = text.replace(quiz_component_anchor, quiz_helpers + quiz_component_anchor, 1)

          old_save = '''            const parsed = JSON.parse(quizContent) as QuizQuestion[];
            if (!Array.isArray(parsed) || parsed.length === 0) {
                throw new Error('JSONが配列形式ではありません、または空です。');
            }
            const file = new File([quizContent], 'quiz.json', { type: 'application/json' });
            setIsSaving(true);
            await onSave(file);
        } catch (e) {
            console.error(e);
            setError('無効なJSON形式です。AI Studioからの出力をそのまま貼り付けてください。');
            setIsSaving(false);
        }
'''
          new_save = '''            const parsed = parseQuizContent(quizContent);
            const normalizedQuizContent = JSON.stringify(parsed, null, 2);
            const file = new File([normalizedQuizContent], 'quiz.json', { type: 'application/json' });
            setIsSaving(true);
            await onSave(file);
        } catch (e) {
            console.error(e);
            setError(e instanceof Error ? e.message : 'クイズデータの解析に失敗しました。');
            setIsSaving(false);
        }
'''
          assert text.count(old_save) == 1, text.count(old_save)
          text = text.replace(old_save, new_save, 1)
          path.write_text(text)
          PY

      - name: Install dependencies and build
        run: |
          npm install
          npm run build
          git diff --check

      - name: Verify PDF and quiz parser compatibility
        shell: bash
        run: |
          cat > .agent-parser-tests.ts <<'TS'
          import { parsePdfWordCards, formatPdfPronunciation } from './components/PdfExportModal';
          import { parseQuizContent } from './components/QuizCreationModal';

          const assert = (condition: unknown, message: string) => {
            if (!condition) throw new Error(message);
          };

          const jsonCards = parsePdfWordCards(`\`\`\`json
          [{"front":"ramen","back":"ラーメン、中華麺","pronunciation":"[ラ]ーメン","memo":"【語源・雑学】test\\n【覚え方】test\\n【例文】test"}]
          \`\`\``, 'words.txt', 'text/plain');
          assert(jsonCards.length === 1 && jsonCards[0].front === 'ramen', 'JSON stored as text/plain must parse');
          assert(jsonCards[0].pronunciation === '[ラ]ーメン', 'JSON pronunciation must be preserved');

          const richSlash = parsePdfWordCards('🍜 ramen [ラ]ーメン / ラーメン、中華麺 / ラテン語由来の雑学。【覚え方】ラーメンで覚える / I ate ramen.', 'words.txt', 'text/plain');
          assert(richSlash[0].front === 'ramen', 'rich slash front must be separated');
          assert(richSlash[0].back === 'ラーメン、中華麺', 'rich slash meaning must remain back');
          assert(richSlash[0].pronunciation === '[ラ]ーメン', 'rich slash pronunciation must be separated');
          assert((richSlash[0].memo || '').includes('【例文】'), 'rich slash example must be in memo');

          const legacySlash = parsePdfWordCards('ramen / ラーメン / ラーメン / memo', 'words.txt', 'text/plain');
          assert(legacySlash[0].pronunciation === 'ラーメン' && legacySlash[0].memo === 'memo', 'legacy four-column slash must remain compatible');
          assert(formatPdfPronunciation('[ラ]ーメン') === '[ラ]ーメン', 'accent brackets must not double');
          assert(formatPdfPronunciation('ラーメン') === '[ラーメン]', 'legacy pronunciation must keep existing display style');

          const quiz = parseQuizContent(`\`\`\`json
          [{"question":"What is ramen?","choices":["A","B","C","D"],"correctAnswerIndex":1,"explanationCorrect":"ok","explanationIncorrect":"no"}]
          \`\`\``);
          assert(quiz.length === 1 && quiz[0].correctAnswerIndex === 1, 'fenced quiz JSON must parse');

          let invalidChoicesRejected = false;
          try {
            parseQuizContent('[{"question":"Q","choices":["A","B"],"correctAnswerIndex":0}]');
          } catch {
            invalidChoicesRejected = true;
          }
          assert(invalidChoicesRejected, 'invalid choice count must be rejected');

          let invalidIndexRejected = false;
          try {
            parseQuizContent('[{"question":"Q","choices":["A","B","C","D"],"correctAnswerIndex":4}]');
          } catch {
            invalidIndexRejected = true;
          }
          assert(invalidIndexRejected, 'invalid correctAnswerIndex must be rejected');

          console.log('Parser compatibility checks passed');
          TS
          ./node_modules/.bin/esbuild .agent-parser-tests.ts --bundle --platform=node --format=esm --outfile=/tmp/agent-parser-tests.mjs
          node /tmp/agent-parser-tests.mjs
          rm .agent-parser-tests.ts

          grep -q 'window.print()' components/PdfExportModal.tsx
          grep -q 'size: B5 landscape' components/PdfExportModal.tsx
          grep -q 'await onUpdateMaterial(materialId, { quizFile: file })' components/ReaderScreen.tsx
          grep -q 'onStartQuiz(materialId)' components/ReaderScreen.tsx

      - name: Commit only targeted files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/agent-fix-player-pdf-quiz.yml
          git add components/ReaderScreen.tsx components/PdfExportModal.tsx components/QuizCreationModal.tsx
          git commit -m "fix: pin mobile player and harden PDF quiz inputs"
          git push origin HEAD:agent/fix-player-pdf-quiz-final
