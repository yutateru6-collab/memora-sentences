# Compact visual handoff v5
name: Verify Create Home Redesign

on:
  push:
    branches:
      - agent/create-home-redesign
    paths:
      - .github/workflows/apply-create-home-redesign.yml
      - App.tsx
      - components/CreateHomeScreen.tsx
      - create-home.css
      - tools/capture-create-home.mjs
      - tools/build-create-home-vision.mjs

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/create-home-redesign

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Isolate create-home mascot from legacy CSS selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/CreateHomeScreen.tsx')
          text = path.read_text()
          old = '/mascots/06_紫_ノートを書くステゴサウルス.png'
          new = '/mascots/06_%E7%B4%AB_%E3%83%8E%E3%83%BC%E3%83%88%E3%82%92%E6%9B%B8%E3%81%8F%E3%82%B9%E3%83%86%E3%82%B4%E3%82%B5%E3%82%A6%E3%83%AB%E3%82%B9.png'
          if old in text:
              path.write_text(text.replace(old, new))
              print('Rewrote mascot path to avoid legacy :has() selectors')
          else:
              print('Mascot path already isolated')
          PY

      - name: Install dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start Vite app
        run: |
          npm run dev > /tmp/memora-create-home-vite.log 2>&1 &
          echo $! > /tmp/memora-create-home-vite.pid

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/memora-create-home-vite.log || true
          exit 1

      - name: Run create-home QA
        id: create_home_qa
        continue-on-error: true
        run: node tools/capture-create-home.mjs
        env:
          APP_URL: http://127.0.0.1:3000
          QA_REPOSITORY: ${{ github.repository }}
          QA_COMMIT_SHA: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}

      - name: Prepare AI vision handoff
        if: always()
        run: node tools/build-create-home-vision.mjs

      - name: Persist verified mascot collision fix
        if: steps.create_home_qa.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- components/CreateHomeScreen.tsx; then
            git add components/CreateHomeScreen.tsx
            git commit -m "Isolate create home mascot from legacy styles"
            git push origin HEAD:agent/create-home-redesign
          else
            echo "No mascot-path change to persist"
          fi

      - name: Stop Vite
        if: always()
        run: |
          if [ -f /tmp/memora-create-home-vite.pid ]; then
            kill "$(cat /tmp/memora-create-home-vite.pid)" >/dev/null 2>&1 || true
          fi

      - name: Publish latest create-home evidence
        if: always()
        run: |
          if [ ! -d qa-create-home-artifacts ]; then
            echo "qa-create-home-artifacts is missing"
            exit 1
          fi

          rm -rf /tmp/qa-create-home-latest
          mkdir -p /tmp/qa-create-home-latest
          cp -R qa-create-home-artifacts/. /tmp/qa-create-home-latest/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan qa-create-home-latest-temp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R /tmp/qa-create-home-latest/. .
          git add report.json screenshots/ vision/
          git commit -m "Update create-home QA evidence"
          git push --force origin HEAD:qa-create-home-latest

      - name: Fail when create-home QA failed
        if: steps.create_home_qa.outcome != 'success'
        run: exit 1
