name: Apply automatic persona selection

on:
  push:
    branches:
      - agent/auto-persona-from-generator

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/auto-persona-from-generator
          fetch-depth: 0

      - name: Apply targeted patch
        run: python .github/agent-auto-persona-selection.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify and commit source-only diff
        shell: bash
        run: |
          git diff --check
          rm .github/agent-auto-persona-selection.py
          rm .github/workflows/agent-auto-persona-selection.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' App.tsx components/PromptLibraryScreen.tsx components/ReaderScreen.tsx | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Carry selected persona roles into reader avatars"
          git push origin HEAD:agent/auto-persona-from-generator
