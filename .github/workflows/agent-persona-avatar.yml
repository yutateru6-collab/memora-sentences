name: Apply persona comment avatars

on:
  push:
    branches:
      - agent/add-persona-comment-avatars

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-persona-comment-avatars
          fetch-depth: 0

      - name: Apply targeted Reader patch
        run: python .github/agent-add-persona-avatars.py

      - name: Verify persona assets
        run: |
          test -f 'public/personas/01_ギャル.png'
          test -f 'public/personas/02_大学生.png'
          test -f 'public/personas/03_高校教師.png'
          test -f 'public/personas/04_司書.png'
          test -f 'public/personas/05_主婦.png'
          test -f 'public/personas/06_経営者.png'
          test -f 'public/personas/07_おじいちゃん.png'
          test -f 'public/personas/08_ゲーム実況者.png'
          test -f 'public/personas/09_ミステリー小説の探偵.png'
          test -f 'public/personas/10_異世界から来た騎士.png'

      - name: Build and diff check
        run: |
          npm install
          npm run build
          git diff --check

      - name: Keep only Reader change
        run: |
          rm .github/agent-add-persona-avatars.py
          rm .github/workflows/agent-persona-avatar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/ReaderScreen.tsx .github/agent-add-persona-avatars.py .github/workflows/agent-persona-avatar.yml
          git commit -m 'feat: show persona avatars beside explanation comments'
          git push origin HEAD:agent/add-persona-comment-avatars
