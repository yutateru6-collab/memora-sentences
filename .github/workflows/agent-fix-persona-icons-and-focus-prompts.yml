name: Repair persona icons and focus prompt library

on:
  push:
    branches:
      - agent/fix-persona-icons-and-focus-prompts

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-persona-icons-and-focus-prompts
          fetch-depth: 0

      - name: Apply targeted repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/agent-fix-persona-icons-and-focus-prompts.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "for asset in PERSONA_ASSETS := [",
              "PERSONA_ASSETS = [",
              1,
          )
          text = text.replace(
              "]:\n    if asset not in reader_text:",
              "]\nfor asset in PERSONA_ASSETS:\n    if asset not in reader_text:",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile .github/agent-fix-persona-icons-and-focus-prompts.py
          python .github/agent-fix-persona-icons-and-focus-prompts.py

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' App.tsx components/PromptLibraryScreen.tsx components/ReaderScreen.tsx | sort)"
          test "$changed" = "$expected"

      - name: Commit final source changes
        shell: bash
        run: |
          rm .github/agent-fix-persona-icons-and-focus-prompts.py
          rm .github/workflows/agent-fix-persona-icons-and-focus-prompts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix persona avatars and focus creation modes"
          git push origin HEAD:agent/fix-persona-icons-and-focus-prompts
