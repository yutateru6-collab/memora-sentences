name: QA Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Every day at 03:00 JST (18:00 UTC)
    - cron: '0 18 * * *'

permissions:
  contents: write

concurrency:
  group: qa-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Verify production build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Vite app
        run: |
          npm run dev > /tmp/memora-vite.log 2>&1 &
          echo $! > /tmp/memora-vite.pid

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become ready"
          cat /tmp/memora-vite.log || true
          exit 1

      - name: Run browser QA and capture screenshots
        run: node tools/capture-screenshots.mjs
        env:
          APP_URL: http://127.0.0.1:3000
          QA_REPOSITORY: ${{ github.repository }}
          QA_COMMIT_SHA: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_NUMBER: ${{ github.run_number }}
          QA_EVENT_NAME: ${{ github.event_name }}

      - name: Publish latest QA evidence for ChatGPT
        if: always()
        env:
          QA_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/qa-latest/screenshots

          REPORT_PRESENT=false
          if [ -f qa-artifacts/report.json ]; then
            cp qa-artifacts/report.json /tmp/qa-latest/report.json
            REPORT_PRESENT=true
          fi

          if [ -d qa-artifacts/screenshots ]; then
            cp -R qa-artifacts/screenshots/. /tmp/qa-latest/screenshots/
          fi

          QA_STATUS="failure"
          if [ "$REPORT_PRESENT" = "true" ]; then
            QA_STATUS="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('qa-artifacts/report.json','utf8')); process.stdout.write(r.status || 'failure')" 2>/dev/null || echo failure)"
          fi

          SCREENSHOT_COUNT="$(find /tmp/qa-latest/screenshots -type f 2>/dev/null | wc -l | tr -d ' ')"

          cat > /tmp/qa-latest/latest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "QA Screenshots",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "commit_sha": "${GITHUB_SHA}",
            "job_status": "${QA_JOB_STATUS}",
            "qa_status": "${QA_STATUS}",
            "report_present": ${REPORT_PRESENT},
            "screenshot_count": ${SCREENSHOT_COUNT},
            "storage": "qa-latest branch",
            "screenshots_path": "screenshots/",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan qa-latest-temp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R /tmp/qa-latest/. .
          git add .
          git commit -m "Update latest QA evidence"
          git push --force origin HEAD:qa-latest
