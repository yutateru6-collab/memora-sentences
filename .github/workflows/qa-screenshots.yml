name: QA Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Every day at 03:00 JST (18:00 UTC)
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Vite app
        run: |
          npm run dev > /tmp/memora-vite.log 2>&1 &
          echo $! > /tmp/memora-vite.pid

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become ready"
          cat /tmp/memora-vite.log || true
          exit 1

      - name: Capture desktop and iPhone screenshots
        run: node tools/capture-screenshots.mjs
        env:
          APP_URL: http://127.0.0.1:3000

      - name: Publish latest screenshots for ChatGPT
        if: always()
        run: |
          mkdir -p /tmp/qa-latest/screenshots

          if [ -f qa-artifacts/report.json ]; then
            cp qa-artifacts/report.json /tmp/qa-latest/report.json
          fi

          if [ -d qa-artifacts/screenshots ]; then
            cp -R qa-artifacts/screenshots/. /tmp/qa-latest/screenshots/
          fi

          cat > /tmp/qa-latest/latest.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflow": "QA Screenshots",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "commit_sha": "${GITHUB_SHA}",
            "storage": "qa-latest branch",
            "screenshots_path": "screenshots/",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan qa-latest-temp
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/qa-latest/. .
          git add .
          git commit -m "Update latest QA screenshots"
          git push --force origin HEAD:qa-latest
